# Automatische Tests bei jedem Pull Request und auf main. Nur erfundene Daten; die Tests gehen nie ins Netz.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']      # freigegebene Version: Tests und Abgleich des Tags mit der Programmversion

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Zielsystem des Servers: Ubuntu 24.04 mit Python 3.12 und genau den Paketen des Servers (Prüfsummen)
          - python: '3.12'
            install: 'pip install --require-hashes --only-binary=:all: -r server/requirements-server.txt'
          # neuere Python-Version mit den Paketen aus requirements.txt (Entwicklung)
          - python: '3.13'
            install: 'pip install -r requirements.txt'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Pakete installieren
        run: ${{ matrix.install }}
      - name: Tag passt zur Programmversion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n "s/^VERSION='\(.*\)'.*/\1/p" app.py | head -n 1)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME passt nicht zur Programmversion $version"; exit 1; }
      - name: Tests (einschließlich Wächter test_repo.py – keine Daten oder Schlüssel im Repository)
        env:
          TZ: Europe/Berlin
          LANG: C.UTF-8
        run: python -m unittest discover

  oberflaeche:
    name: Oberfläche (Maskierung)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tests/html_escape.mjs

  browser:
    name: Browser-Durchläufe (fachliche Abläufe und Serverbetrieb)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pakete und Chromium installieren
        run: |
          pip install -r requirements.txt
          npm install -g playwright@1.63.0
          playwright install --with-deps chromium
      - name: Durchläufe mit erfundenen Daten (gehen nie ins Netz)
        env:
          TZ: Europe/Berlin
          LANG: C.UTF-8
        run: |
          NODE_PATH="$(npm root -g)"
          export NODE_PATH
          # Scheitert ein Durchlauf, läuft er einmal nach: besteht er dann, ist er „wackelig“ (Warnung, bitte stabilisieren)
          lauf() {
            node "tests/$1.mjs" "$RUNNER_TEMP/$1" && return 0
            echo "::warning::$1 ist im ersten Anlauf gescheitert – Wiederholung"
            node "tests/$1.mjs" "$RUNNER_TEMP/$1-2" && echo "::warning::$1 ist wackelig (erst im zweiten Anlauf bestanden)"
          }
          lauf ui_smoke
          lauf ui_server
