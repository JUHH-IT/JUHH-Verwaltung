# JU Hamburg Finanzen – Schalter der Härtung des Betriebssystems (SERVER.md, Abschnitt „Härtung“).
# Nach einer Änderung:  sudo ju-finanzen haerten --pruefen   und dann   sudo ju-finanzen haerten
# ja = Maßnahme anwenden. nein = Maßnahme nicht anwenden; ihre eigenen Dateien und Zeitgeber werden wieder entfernt.

# 1 Firewall: Grundregeln in ufw sicherstellen (nur ergänzen, was fehlt) und die Schutztabelle „inet ju_schutz“ laden
FIREWALL=ja
# Tailscale-Port 41641/udp zusätzlich in ufw freigeben? Vorgabe nein: Tailscale öffnet seinen Port selbst.
# Nur nötig, wenn Tailscale mit --netfilter-mode=off oder nodivert läuft.
TAILSCALE_PORT=nein
# 2 Sperrliste Spamhaus DROP: täglich laden, prüfen und in die Schutztabelle übernehmen
SPERRLISTE=ja
# 3 fail2ban für SSH (sperrt Adressen nach Fehlversuchen; Tailscale und Konsole des Anbieters nie)
FAIL2BAN=ja
# 4 Kern-Einstellungen (sysctl) in /etc/sysctl.d/80-ju-haertung.conf
KERN=ja
# 5 Automatische Sicherheitsupdates (unattended-upgrades)
UPDATES=ja
# Nach Kernel-Updates von selbst neu starten (nachts 04:30)? Vorgabe nein: der Statusbericht meldet nur.
UPDATES_NEUSTART=nein
# 6 Docker und containerd abschalten, wenn kein Container existiert
DOCKER_AUS=ja
# 7 SSH-Grundhärtung (Fehlversuche, Wartezeit, X11 aus, Weiterleitung nur lokal). Ändert nie die Art der Anmeldung.
SSH=ja
# 8 Rechte der Einstellungen und Sicherungen, keine Speicherabzüge (Core-Dumps), Protokoll (journald) begrenzt und dauerhaft
DATEIEN=ja
# 9 Statusbericht für das Programm (alle 15 Minuten nach /var/lib/ju-serverschutz/status.json)
STATUS=ja

# Riskante Schalter – setzt nur der Befehl selbst, nachdem er die Voraussetzungen geprüft hat:
#   sudo ju-finanzen haerten --ssh-nur-schluessel    bzw.    sudo ju-finanzen haerten --ssh-nur-tailscale
# Ein „ja“ von Hand bewirkt allein nichts: Wirksam wird es erst in einem haerten-Lauf, der den Nachweis besteht.
# Zurück: hier wieder auf nein stellen und  sudo ju-finanzen haerten  ausführen.
SSH_NUR_SCHLUESSEL=nein
SSH_NUR_TAILSCALE=nein

# Neue SSH-Verbindungen je Quelladresse und Minute (darüber verwirft die Schutztabelle; Tailscale ist ausgenommen)
SSH_NEU_JE_MINUTE=12
# Adressen oder Netze, die nie gesperrt werden (Leerzeichen dazwischen), z. B. der eigene Anschluss: 203.0.113.7 2001:db8:1::/48
NIE_SPERREN=
